<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hacemos la ley · Una idea puede cambiar las reglas</title>
  <meta name="description" content="Experiencia educativa transmedia: una simulación para comprender cómo se forman las leyes en Argentina.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23142D4E'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23F2C14E' font-family='Arial Black'%3EHL%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="topbar">
    <a class="brand" href="#/bienvenida" aria-label="Hacemos la ley, ir al inicio">
      <span class="brand-mark">HACEMOS<br>LA LEY</span>
      <span class="brand-tag">Una idea puede<br><u>cambiar las reglas</u></span>
    </a>
    <nav class="topnav" aria-label="Opciones">
      <button type="button" class="navbtn" data-action="expediente" id="btn-expediente" hidden>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h10l6 6v10H4z M14 4v6h6" /></svg><span>Expediente</span>
      </button>
      <button type="button" class="navbtn" data-action="como">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>Cómo funciona</span>
      </button>
      <button type="button" class="navbtn" data-action="glosario">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z M5 17a3 3 0 0 1 3-3h11"/></svg><span>Glosario</span>
      </button>
      <button type="button" class="navbtn" data-action="creditos">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 2.8 3 6"/></svg><span>Créditos</span>
      </button>
      <button type="button" class="navbtn" data-action="reiniciar">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/></svg><span>Reiniciar</span>
      </button>
    </nav>
  </header>

  <nav class="progress" aria-label="Recorrido de la experiencia" id="progress"></nav>
  <div class="rolechip" id="rolechip" hidden></div>

  <main id="main" tabindex="-1"></main>

  <footer class="simbar" role="note">
    <span class="simbar-badge">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v4M5 12h4M16 11h.01M18 13h.01"/></svg>
      Simulación educativa
    </span>
    <span class="simbar-short">Caso y personajes ficticios</span>
    <span class="simbar-text">Personajes, testimonios, noticias y proyecto de ley son <strong>ficticios</strong>. Las fuentes marcadas como «Fuente real» remiten a normas vigentes.</span>
  </footer>

  <!-- Panel lateral del expediente -->
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-inner" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title">Expediente digital</h2>
        <button type="button" class="iconbtn" data-close="drawer" aria-label="Cerrar expediente">✕</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </aside>

  <!-- Modal genérico -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="iconbtn modal-x" data-close="modal" aria-label="Cerrar">✕</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/expediente.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/legislative-process.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
